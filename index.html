<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f7a5a"><link rel="icon" href="icon-192.png"><title>مُتقِن – متابعة الحفظ</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--tx:#1d2b24;--mu:#6b7a72;--ac:#1f7a5a;--ac2:#e3f2ec;--bd:#e4dfd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18221d;--tx:#e8efe9;--mu:#93a39a;--ac:#4cc79a;--ac2:#1c3028;--bd:#2a3a32}}
:root[data-theme="dark"]{--bg:#101814;--card:#18221d;--tx:#e8efe9;--mu:#93a39a;--ac:#4cc79a;--ac2:#1c3028;--bd:#2a3a32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mu);font-size:13px;margin:0 0 12px}
.bar{height:8px;background:var(--ac2);border-radius:8px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:16px;margin:0 0 2px;color:var(--ac)}
.card p{margin:0 0 8px;color:var(--mu);font-size:13px}
.st{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd);cursor:pointer}
.st input{width:22px;height:22px;accent-color:var(--ac)}
.st.on span{text-decoration:line-through;color:var(--mu)}
.ct{display:flex;gap:14px;align-items:center;padding:10px 0 2px;border-top:1px solid var(--bd)}
.big{width:84px;height:84px;border-radius:50%;border:3px solid var(--ac);background:var(--ac2);color:var(--tx);font-size:28px;font-weight:700;cursor:pointer}
.big small{font-size:13px;color:var(--mu)}
.big.ok{background:var(--ac);color:#fff}.big.ok small{color:#fff}
.mini{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:2px 12px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px solid var(--bd)}
.chip{min-width:46px;padding:6px 8px;border-radius:10px;border:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.fin{width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.fin[disabled]{opacity:.55}
.set label{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.set input{width:80px;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);text-align:center}
.danger{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:8px;padding:6px 12px;cursor:pointer;margin-top:8px}
#rd{display:none;position:fixed;inset:auto 0 0 0;max-height:70%;overflow:auto;background:var(--card);border-top:2px solid var(--ac);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:5}
.qt{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:24px;line-height:2.3;text-align:justify}
.row{display:flex;gap:8px;align-items:center}.row input{flex:1;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);text-align:center}
</style></head><body><main id="app"></main><aside id="rd"></aside>
<script>
const K='hifz-v1',$=s=>document.querySelector(s);
const dayIdx=()=>{const n=new Date();return Math.floor(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/864e5)};
let S,armed=false;
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){S=null}
 if(!S)S={start:1,per:1,reps:40,mem:[],pos:0,t:null};S.ex=S.ex||[]}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const di=x=>{const[y,m,d]=x.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
const ds=i=>new Date(i*864e5).toISOString().slice(0,10);
const isEx=T=>S.ex.some(x=>di(x.a)<=T&&T<=di(x.b));
function nextPages(){const last=S.mem.length?Math.max(...S.mem.map(e=>e.p)):S.start-1;const a=[];for(let i=1;i<=S.per;i++)if(last+i<=604)a.push(last+i);return a}
function applyEx(){const t=S.t;if(t&&!t.done){t.ex=isEx(dayIdx());t.np=t.ex?[]:nextPages()}save();render()}
function addEx(a,b){if(!a)return;b=b||a;if(b<a)[a,b]=[b,a];S.ex.push({a,b});applyEx()}
function delEx(i){S.ex.splice(i,1);applyEx()}
function exToday(on){const T=dayIdx();if(on)S.ex.push({a:ds(T),b:ds(T)});else{const r=[];S.ex.forEach(x=>{const a=di(x.a),b=di(x.b);if(a<=T&&T<=b){if(a<T)r.push({a:x.a,b:ds(T-1)});if(b>T)r.push({a:ds(T+1),b:x.b})}else r.push(x)});S.ex=r}applyEx()}
function initDay(){
 const T=dayIdx();if(S.t&&S.t.d===T)return;
 const ex=isEx(T),np=ex?[]:nextPages();
 const prev=Math.max(0,...S.mem.map(e=>e.d).filter(d=>d<T));
 const yd=prev?S.mem.filter(e=>e.d===prev).map(e=>e.p).sort((a,b)=>a-b):[];
 const link=S.mem.filter(e=>e.d<T&&e.d>=T-30).map(e=>e.p).sort((a,b)=>a-b);
 const old=S.mem.filter(e=>e.d<T-30).map(e=>e.p).sort((a,b)=>a-b);
 let rev=[],size=0;
 if(old.length){size=Math.ceil(old.length/6);for(let i=0;i<size;i++)rev.push(old[(S.pos+i)%old.length]);rev=[...new Set(rev)]}
 S.t={d:T,np,ex,yd,link,rev,size,c:{},done:false};save()}
const tg=k=>{S.t.c[k]=!S.t.c[k];save();render()};
const tp=(k,p)=>{S.t.c[k]=S.t.c[k]||{};S.t.c[k][p]=!S.t.c[k][p];save();render()};
const inc=(k,m,n)=>{S.t.c[k]=Math.max(0,Math.min(m,(S.t.c[k]||0)+n));save();render()};
const chk=(k,x)=>`<label class="st ${S.t.c[k]?'on':''}"><input type="checkbox" ${S.t.c[k]?'checked':''} onchange="tg('${k}')"><span>${x}</span></label>`;
const ctr=(k,m,l)=>{const v=S.t.c[k]||0;return `<div class="ct"><button class="big ${v>=m?'ok':''}" onclick="inc('${k}',${m},1)">${v}<small>/${m}</small></button><div><b>${l}</b><br><button class="mini" onclick="inc('${k}',${m},-1)">تراجع −1</button></div></div>`};
const chips=(k,a)=>`<div class="chips">${a.map(p=>`<button class="chip ${(S.t.c[k]||{})[p]?'on':''}" onclick="tp('${k}',${p})">${p}</button>`).join('')}</div>`;
function setv(k,v){v=parseInt(v);if(v>0){S[k]=v;if(k!=='start')S.t=null;save();if(!S.t){initDay()}render()}}
function finish(){const t=S.t;if(t.done)return;t.np.forEach(p=>S.mem.push({p,d:t.d}));S.pos+=t.size;t.done=true;save();render()}
function rebase(st,last){
 st=Math.min(Math.max(parseInt(st)||1,1),604);last=Math.min(parseInt(last)||0,604);S.start=st;
 const T=dayIdx();S.mem=[];
 if(last>=st)for(let p=st;p<=last;p++)S.mem.push({p,d:T-1-Math.floor((last-p)/S.per)});
 S.pos=0;S.t=null;save();initDay();render()}
let au=null,q=[],qi=0;
async function showPage(p){
 p=Math.min(Math.max(parseInt(p)||1,1),604);const r=$('#rd');r.style.display='block';
 r.innerHTML=`<button class="mini" onclick="closeRd()">إغلاق ✕</button> <b>وجه ${p}</b><p id="rt">جارٍ التحميل…</p>`;
 try{
  const [a,b]=await Promise.all(['quran-uthmani','ar.alafasy'].map(e=>fetch(`https://api.alquran.cloud/v1/page/${p}/${e}`).then(x=>x.json())));
  const rt=$('#rt');rt.className='qt';rt.textContent=a.data.ayahs.map(y=>y.text+' ﴿'+y.numberInSurah+'﴾').join(' ');
  q=b.data.ayahs.map(y=>y.audio);
  r.insertAdjacentHTML('beforeend','<div class="row"><button class="mini" onclick="play()">▶ تشغيل التلاوة</button><button class="mini" onclick="stopA()">⏹ إيقاف</button></div>');
 }catch(e){$('#rt').textContent='تعذّر التحميل. عرض النص والتلاوة يعملان داخل تطبيق أندرويد (أو من استضافتك) مع اتصال بالإنترنت.'}}
function play(){stopA();qi=0;nextA()}
function nextA(){if(qi>=q.length)return;au=new Audio(q[qi++]);au.onended=nextA;au.play().catch(()=>{})}
function stopA(){if(au){au.onended=null;au.pause();au=null}}
function closeRd(){stopA();$('#rd').style.display='none'}
async function remind(v){
 S.rem=v;save();const L=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
 if(L){try{await L.requestPermissions();await L.cancel({notifications:[{id:1}]});
  if(v){const[h,m]=v.split(':').map(Number);await L.schedule({notifications:[{id:1,title:'وقت الحفظ',body:'ورد اليوم: حفظ وربط ومراجعة',schedule:{on:{hour:h,minute:m},allowWhileIdle:true}}]})}}catch(e){}}
 render()}
function reset(){if(!armed){armed=true;render();return}try{localStorage.removeItem(K)}catch(e){}armed=false;load();initDay();render()}
function render(){
 const t=S.t,n=S.mem.length,lastP=n?Math.max(...S.mem.map(e=>e.p)):0;
 let tot=0,dn=0;
 if(t.np.length){tot+=4;['listen','tafsir','mem','read3'].forEach(k=>dn+=t.c[k]?1:0);tot+=1;dn+=(t.c.rep||0)>=S.reps?1:0}
 if(t.yd.length){tot+=1;dn+=(t.c.yrep||0)>=5?1:0}
 [['link',t.link],['rev',t.rev]].forEach(([k,a])=>{tot+=a.length;dn+=a.filter(p=>(t.c[k]||{})[p]).length});
 const pct=tot?Math.round(dn/tot*100):100;
 let h=`<h1>متابعة الحفظ</h1><p class="sub">حفظ · ربط · مراجعة — لا يغني أحدها عن الآخر</p>
 <div class="card"><b>${n}</b> وجه محفوظ من 604<div class="bar"><i style="width:${n/604*100}%"></i></div>
 <small class="sub">إنجاز اليوم: ${pct}%</small><div class="bar"><i style="width:${pct}%"></i></div></div>`;
 h+=`<div class="card"><h2>عرض وجه مع التلاوة</h2><div class="row"><input id="vp" type="number" min="1" max="604" value="${t.np[0]||lastP||1}"><button class="mini" onclick="showPage($('#vp').value)">📖 عرض</button></div></div>`;
 h+=`<div class="card"><h2>١ · الحفظ${t.np.length?' — وجه '+t.np.join('، '):t.ex?' — موقوف بعذر':''}</h2>`;
 if(t.np.length){h+=`<p>خذ أول سطر من الوجه التالي لتربط بين الأوجه</p>`+
  chk('listen','استمع إلى قارئ متقن')+chk('tafsir','اقرأ تفسير المقدار')+chk('mem','احفظ الوجه')+chk('read3','اقرأ ما حفظت 3 مرات وسجّله')+ctr('rep',S.reps,'كرّر الوجه')+(t.done?'':'<button class="danger" onclick="exToday(true)">تقديم عذر اليوم</button>')}
 else if(t.ex)h+=`<p>أنت في فترة عذر: الحفظ الجديد وتفسيره وتكراره موقوف اليوم. يستمر تثبيت الأمس والربط والمراجعة.</p><button class="danger" onclick="exToday(false)">إلغاء عذر اليوم</button>`;
 else h+=`<p>لا يوجد حفظ جديد (أتممت المصحف أو اخترت 0).</p>`;
 h+=`</div><div class="card"><h2>٢ · تثبيت الأمس</h2>`;
 h+=t.yd.length?`<p>كرّر وجه ${t.yd.join('، ')} خمس مرات</p>`+ctr('yrep',5,'التكرار'):`<p>لا يوجد حفظ سابق بعد.</p>`;
 h+=`</div><div class="card"><h2>٣ · الربط</h2><p>سمّع من الحفظ مرة واحدة دون النظر في المصحف — أوجه آخر 30 يومًا</p>`;
 h+=t.link.length?chips('link',t.link):`<p>ستظهر هنا أوجهك بعد يوم من الحفظ.</p>`;
 h+=`</div><div class="card"><h2>٤ · المراجعة</h2><p>الأرشيف القديم (ما تجاوز 30 يومًا) — يُكمل كل 6 أيام</p>`;
 h+=t.rev.length?chips('rev',t.rev):`<p>يبدأ الأرشيف بعد مرور 30 يومًا على أول وجه.</p>`;
 h+=`</div><button class="fin" ${t.done?'disabled':''} onclick="finish()">${t.done?'✓ تم إنجاز اليوم — بارك الله فيك':'أنهيت اليوم وأثبّت الحفظ'}</button>
 <div class="card set"><h2>الإعدادات</h2>
 <label>أول وجه حفظته<input type="number" min="1" max="604" value="${S.start}" onchange="rebase(this.value,${lastP})"></label>
 <label>آخر وجه حفظته (0 = لم أبدأ)<input type="number" min="0" max="604" value="${lastP}" onchange="rebase(${S.start},this.value)"></label>
 <p>عند تغيير الرقمين يُعاد حساب الربط (آخر 30 يومًا) والمراجعة (الأقدم) تلقائيًا.</p>
 <h2 style="margin-top:12px">الأعذار</h2><p>خلال العذر يتوقف الحفظ الجديد وتفسيره وتكراره، ويستمر تثبيت الأمس والربط والمراجعة.</p>
 <label>من<input id="ea" type="date" style="width:150px" value="${ds(dayIdx())}"></label>
 <label>إلى<input id="eb" type="date" style="width:150px" value="${ds(dayIdx())}"></label>
 <button class="mini" onclick="addEx($('#ea').value,$('#eb').value)">إضافة عذر</button>
 ${S.ex.map((x,i)=>`<div class="row" style="padding:6px 0"><span style="flex:1">${x.a===x.b?x.a:x.a+' ← '+x.b}</span><button class="mini" onclick="delEx(${i})">حذف</button></div>`).join('')}
 <label>تذكير يومي<input type="time" value="${S.rem||''}" onchange="remind(this.value)"></label>
 <label>عدد الأوجه يوميًا<input type="number" min="1" max="10" value="${S.per}" onchange="setv('per',this.value)"></label>
 <label>عدد تكرار الحفظ<input type="number" min="1" max="200" value="${S.reps}" onchange="setv('reps',this.value)"></label>
 <button class="danger" onclick="reset()">${armed?'اضغط مرة أخرى للتأكيد':'مسح كل البيانات'}</button></div>`;
 $('#app').innerHTML=h}
load();initDay();render();
try{if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script></body></html>
